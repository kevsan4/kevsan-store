services:
  sake:
    image: ghcr.io/sudashiii/sake:2026.7.10.1
    container_name: sake-selfhost
    environment:
      - LIBSQL_URL=file:/data/sake.db
      - LIBSQL_AUTH_TOKEN=${LIBSQL_AUTH_TOKEN}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=u${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ADMIN_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS}
      - ACTIVATED_PROVIDERS=${ACTIVATED_PROVIDERS}
      - ACTIVATED_METADATA_PROVIDERS=${ACTIVATED_METADATA_PROVIDERS}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - HARDCOVER_API_TOKEN=${HARDCOVER_API_TOKEN}
      - METADATA_PROVIDER_TIMEOUT_MS=${METADATA_PROVIDER_TIMEOUT_MS}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT}
    volumes:
      - '${APP_DATA_DIR}/data/libsql:/data'
    x-runtipi:
      is_main: true
      internal_port: '3000'

  seaweedfs:
    image: chrislusf/seaweedfs:4.17
    container_name: sake-seaweedfs
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - 'weed mini -dir=/data'
    environment:
      - WEED_SERVER_VOLUME_MAX=0
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - '${APP_DATA_DIR}/data/seaweedfs:/data'

